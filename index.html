<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>200 Questões - Licitação, Contratos e Convênios</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #222;
  }
  .container {
    background: #fff; border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    width: 100%; max-width: 820px; padding: 35px 40px;
  }
  .header { display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid #e2e8f0; padding-bottom: 14px; margin-bottom: 18px; }
  .header h1 { font-size: 1.05rem; color: #2a5298; }
  .counter { background: #2a5298; color: #fff; padding: 6px 16px;
    border-radius: 20px; font-size: .9rem; font-weight: 600; white-space: nowrap; }
  .jump { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 22px; font-size: .95rem; }
  .jump label { font-weight: 600; color: #2d3748; }
  .jump input[type="number"] {
    width: 90px; padding: 8px 10px; border: 1px solid #cbd5e0;
    border-radius: 8px; font-size: 1rem; font-family: inherit;
    text-align: center; color: #1a202c;
  }
  .jump input[type="number"]:focus { outline: 2px solid #2a5298; border-color: #2a5298; }
  .jump button { padding: 8px 18px; font-size: .95rem; border-radius: 8px; }
  .jump .total { color: #718096; font-size: .9rem; }
  .question { font-size: 1.15rem; font-weight: 600; line-height: 1.55;
    color: #1a202c; min-height: 90px; margin-bottom: 18px; }
  .answer-box { background: #f0f7ff; border-left: 5px solid #2a5298;
    border-radius: 8px; padding: 16px 18px; font-size: 1rem;
    line-height: 1.6; color: #1a365d; }
  .answer-box strong { color: #2a5298; display: block; margin-bottom: 6px;
    font-size: .85rem; text-transform: uppercase; letter-spacing: .8px; }
  .nav { display: flex; justify-content: space-between; align-items: center;
    margin-top: 28px; gap: 12px; }
  button { background: #2a5298; color: #fff; border: none; padding: 12px 26px;
    border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: background .2s; font-family: inherit; }
  button:hover:not(:disabled) { background: #1e3c72; }
  button:disabled { background: #cbd5e0; cursor: not-allowed; }
  .hint { text-align: center; margin-top: 18px; font-size: .85rem; color: #718096; }
  .hint kbd { background: #edf2f7; border: 1px solid #cbd5e0;
    border-radius: 5px; padding: 2px 7px; font-family: monospace; }
  @media (max-width: 600px) { .container { padding: 24px 20px; }
    .question { font-size: 1rem; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Licitação, Contratos e Convênios</h1>
    <div class="counter" id="counter">1 / 200</div>
  </div>

  <div class="jump">
    <label for="jumpInput">Ir para a questão:</label>
    <input type="number" id="jumpInput" min="1" placeholder="nº" />
    <button onclick="jumpTo()">Ir</button>
    <span class="total">(1 a 200)</span>
  </div>

  <div class="question" id="question"></div>
  <div class="answer-box">
    <strong>Resposta</strong>
    <span id="answer"></span>
  </div>
  <div class="nav">
    <button id="prevBtn" onclick="prev()">← Anterior</button>
    <button id="nextBtn" onclick="next()">Próxima →</button>
  </div>
  <div class="hint">Use as teclas <kbd>←</kbd> e <kbd>→</kbd> do navegador</div>
</div>

<script>
const questoes = [
{q:"O que é licitação?",r:"É o procedimento administrativo pelo qual a Administração Pública seleciona a proposta mais vantajosa para contratar, observando os princípios constitucionais e legais."},
{q:"Qual é a lei geral que rege as licitações e contratos da Administração Pública?",r:"A Lei nº 14.133/2021 (Nova Lei de Licitações), que substituiu a Lei 8.666/93, a Lei 10.520/02 (Pregão) e parte da Lei 12.462/11 (RDC)."},
{q:"Quais são os princípios básicos da licitação?",r:"Legalidade, impessoalidade, moralidade, publicidade, eficiência, interesse público, probidade administrativa, igualdade, competitividade, economicidade, transparência e vinculação ao edital."},
{q:"O que é o edital de licitação?",r:"É o instrumento convocatório que estabelece as regras, condições, critérios e exigências do procedimento licitatório."},
{q:"Quais são as modalidades de licitação previstas na Lei 14.133/2021?",r:"Pregão, concorrência, concurso, leilão e diálogo competitivo."},
{q:"O que é pregão?",r:"Modalidade de licitação obrigatória para bens e serviços comuns, cujo critério de julgamento é o menor preço ou maior desconto, com disputa em sessão pública."},
{q:"O que é concorrência?",r:"Modalidade de licitação para contratação de bens e serviços especiais e de obras e serviços comuns de engenharia."},
{q:"O que é concurso?",r:"Modalidade de licitação para escolha de trabalho técnico, científico ou artístico, mediante instituição de prêmios ou remuneração aos vencedores."},
{q:"O que é leilão?",r:"Modalidade de licitação para alienação de bens imóveis ou de móveis inservíveis, com critério de maior lance."},
{q:"O que é diálogo competitivo?",r:"Modalidade de licitação para contratação de soluções inovadoras ou complexas, em que a Administração dialoga com licitantes previamente selecionados."},
{q:"Quais são os critérios de julgamento previstos na Nova Lei de Licitações?",r:"Menor preço, maior desconto, melhor técnica ou conteúdo artístico, técnica e preço, maior lance (leilão) e maior retorno econômico."},
{q:"O que é contrato administrativo?",r:"É o ajuste entre a Administração Pública e terceiros, regido por cláusulas exorbitantes e pelo direito público, para execução de obras, serviços, compras ou alienações."},
{q:"Quais são as cláusulas exorbitantes dos contratos administrativos?",r:"Prerrogativas da Administração como alteração unilateral, rescisão unilateral, fiscalização, aplicação de sanções e ocupação provisória de bens."},
{q:"O que é convênio?",r:"É o acordo entre entes públicos ou entre ente público e entidade privada sem fins lucrativos, para realização de interesses comuns, com mútua cooperação."},
{q:"Qual a principal diferença entre contrato e convênio?",r:"No contrato há interesses contrapostos e remuneração; no convênio há interesses convergentes e cooperação mútua sem contraprestação."},
{q:"O que é dispensa de licitação?",r:"É a hipótese legal em que a licitação é formalmente dispensável, embora possível, por conveniência administrativa prevista em lei."},
{q:"O que é inexigibilidade de licitação?",r:"Ocorre quando há inviabilidade de competição, como na contratação de fornecedor exclusivo ou de profissional de notória especialização."},
{q:"Qual o prazo de vigência dos contratos administrativos pela Lei 14.133/2021?",r:"Em regra, até 5 anos, podendo ser prorrogado mediante justificativa, respeitados os limites legais para serviços continuados (até 10 anos)."},
{q:"O que é termo de referência?",r:"Documento que define o objeto, as especificações técnicas, as condições de execução e os critérios de julgamento para contratação de bens ou serviços."},
{q:"O que é projeto básico?",r:"Conjunto de elementos que define a obra ou serviço de engenharia, com nível de precisão suficiente para caracterizar o objeto e permitir a elaboração da proposta."},
{q:"O que é projeto executivo?",r:"Conjunto de elementos necessários e suficientes à execução completa da obra, detalhando todas as etapas e soluções técnicas."},
{q:"Quem pode participar de licitação?",r:"Qualquer interessado que atenda às exigências do edital, observadas as vedações legais (ex.: impedimentos por sanções ou conflito de interesses)."},
{q:"O que é habilitação em licitação?",r:"É a fase em que se verifica a capacidade jurídica, técnica, fiscal, social e econômico-financeira do licitante."},
{q:"Quais são as fases do procedimento licitatório na Lei 14.133/2021?",r:"Preparatória, divulgação do edital, apresentação de propostas e lances, julgamento, habilitação, recursal, homologação e adjudicação."},
{q:"O que é adjudicação?",r:"É o ato pelo qual a Administração atribui ao vencedor o objeto da licitação, após a homologação."},
{q:"O que é homologação?",r:"É o ato da autoridade competente que confirma o resultado da licitação e autoriza a contratação."},
{q:"O que é impugnação de edital?",r:"É o instrumento pelo qual qualquer cidadão ou licitante questiona irregularidades no edital, no prazo legal."},
{q:"Qual o prazo para impugnação de edital na Nova Lei de Licitações?",r:"Até 3 dias úteis antes da data de abertura do certame."},
{q:"O que é recurso administrativo em licitação?",r:"É o instrumento para contestar decisões da comissão ou autoridade durante o procedimento licitatório."},
{q:"O que é sanção administrativa em licitação?",r:"É a penalidade aplicada ao licitante ou contratado por descumprimento de obrigações, como advertência, multa, impedimento ou declaração de inidoneidade."},
{q:"O que é declaração de inidoneidade?",r:"Sanção que impede o licitante de contratar com a Administração Pública por até 3 anos, aplicada por irregularidades graves."},
{q:"O que é impedimento de licitar e contratar?",r:"Sanção que veda a participação em licitações e contratações por até 3 anos, conforme a infração."},
{q:"O que é garantia contratual?",r:"É a caução oferecida pelo contratado para assegurar o cumprimento das obrigações contratuais, limitada a 5% ou 10% do valor do contrato, conforme o caso."},
{q:"O que é fiscalização de contratos?",r:"É a atividade da Administração para acompanhar a execução contratual, verificando o cumprimento das obrigações pelo contratado."},
{q:"O que é gestor de contratos?",r:"Servidor designado para coordenar as atividades administrativas relacionadas à execução do contrato."},
{q:"O que é fiscal de contratos?",r:"Servidor designado para acompanhar e fiscalizar diretamente a execução do contrato."},
{q:"O que é reajuste de preços?",r:"É a atualização monetária dos valores contratuais em razão da variação de índices, conforme previsão no edital e no contrato."},
{q:"O que é revisão de preços?",r:"É a alteração do valor contratual por fatos imprevisíveis ou supervenientes que alterem o equilíbrio econômico-financeiro."},
{q:"O que é equilíbrio econômico-financeiro do contrato?",r:"É a relação entre as obrigações do contratado e a remuneração, que deve ser mantida durante toda a execução contratual."},
{q:"O que é alteração unilateral do contrato?",r:"É a prerrogativa da Administração de modificar cláusulas de execução ou o objeto, respeitados os limites legais (25% ou 50% para reforma)."},
{q:"Qual o limite para acréscimos e supressões em contratos de obras e compras?",r:"Em regra, até 25% do valor inicial; para reformas de edifício ou equipamento, até 50%."},
{q:"O que é rescisão contratual?",r:"É a extinção do contrato antes do término, por acordo, por determinação da Administração ou por descumprimento."},
{q:"Quais são as formas de rescisão do contrato administrativo?",r:"Unilateral (por interesse público ou descumprimento), consensual (por acordo) e judicial."},
{q:"O que é convênio público?",r:"Acordo entre entes federativos ou entre a Administração e entidades privadas sem fins lucrativos para cooperação mútua em prol do interesse público."},
{q:"Qual é a lei que disciplina os convênios com a União?",r:"A Lei nº 13.019/2014 (Marco Regulatório das Organizações da Sociedade Civil) e o Decreto nº 6.170/2007, entre outras normas."},
{q:"O que é plano de trabalho em convênio?",r:"Documento que detalha o objeto, as metas, a aplicação dos recursos e o cronograma do convênio."},
{q:"O que é contrapartida em convênio?",r:"É a participação financeira ou em bens e serviços do convenente, prevista no plano de trabalho."},
{q:"O que é prestação de contas de convênio?",r:"É a apresentação, pelo convenente, da documentação comprobatória da aplicação dos recursos recebidos."},
{q:"O que é termo de parceria?",r:"É o instrumento firmado entre o Poder Público e as Organizações da Sociedade Civil de Interesse Público (OSCIP) para fomento e execução de projetos."},
{q:"O que é contrato de gestão?",r:"É o instrumento firmado entre o Poder Público e organizações sociais para a execução de atividades públicas não exclusivas."},
{q:"O que é chamamento público?",r:"É o procedimento para selecionar organizações da sociedade civil interessadas em firmar parcerias com a Administração."},
{q:"Quais são os tipos de parceria previstos na Lei 13.019/2014?",r:"Termo de fomento, termo de colaboração e acordo de cooperação."},
{q:"O que é termo de fomento?",r:"Parceria em que a Administração apoia projeto proposto pela organização da sociedade civil."},
{q:"O que é termo de colaboração?",r:"Parceria em que a Administração propõe o projeto e a organização da sociedade civil executa."},
{q:"O que é acordo de cooperação?",r:"Parceria sem transferência de recursos financeiros, para mútua cooperação entre as partes."},
{q:"O que é plano de trabalho em parceria da Lei 13.019/2014?",r:"Documento que descreve o objeto, metas, indicadores, cronograma e aplicação dos recursos da parceria."},
{q:"O que é conta bancária específica em convênio?",r:"Conta exclusiva para movimentação dos recursos do convênio, vedada a mistura com recursos próprios."},
{q:"O que é ingerência indevida em convênio?",r:"É a interferência do concedente na gestão do convenente além dos limites legais, o que é vedado."},
{q:"O que é denúncia em convênio?",r:"É a comunicação de irregularidades ou descumprimento das obrigações do convênio aos órgãos de controle."},
{q:"O que é tomada de contas especial?",r:"É o procedimento para apurar danos ao erário quando não há prestação de contas ou há irregularidades em convênios."},
{q:"O que é certame licitatório?",r:"É o conjunto de atos do procedimento licitatório, desde a publicação do edital até a homologação."},
{q:"O que é comissão de contratação?",r:"É o colegiado designado para conduzir o procedimento licitatório e julgar as propostas."},
{q:"O que é agente de contratação?",r:"Servidor designado para conduzir a licitação, tomar decisões e executar as ações necessárias ao bom andamento do certame."},
{q:"O que é estudo técnico preliminar (ETP)?",r:"Documento que evidencia a necessidade da contratação e define a melhor solução, embasando o termo de referência ou projeto."},
{q:"O que é matriz de riscos?",r:"Instrumento contratual que define a alocação de riscos entre as partes, utilizada em contratações de maior complexidade."},
{q:"O que é seguro-garantia?",r:"É a modalidade de garantia contratual que cobre riscos de inadimplemento do contratado, podendo chegar a 30% do valor do contrato em obras."},
{q:"O que é contratação integrada?",r:"Regime em que o contratado elabora o projeto básico e executivo e realiza a obra, com responsabilidade integral pelo resultado."},
{q:"O que é contratação semi-integrada?",r:"Regime em que o contratado elabora o projeto executivo com base no projeto básico fornecido pela Administração e executa a obra."},
{q:"O que é empreitada por preço global?",r:"Regime de execução em que o contratado recebe valor fixo pela execução completa da obra ou serviço."},
{q:"O que é empreitada por preço unitário?",r:"Regime em que o contratado recebe por unidade de medida executada, conforme quantitativos do projeto."},
{q:"O que é tarefa em licitação?",r:"Regime de execução para pequenos serviços ou obras, com remuneração por tarefa concluída."},
{q:"O que é registro de preços?",r:"É o procedimento para registro de preços de bens ou serviços em ata, permitindo contratações futuras sem nova licitação."},
{q:"O que é ata de registro de preços?",r:"Documento que formaliza os preços registrados e as condições para contratações futuras pelos órgãos participantes."},
{q:"O que é órgão gerenciador de ata de registro de preços?",r:"Órgão responsável pela condução do procedimento de registro de preços e pela gestão da ata."},
{q:"O que é órgão participante de ata de registro de preços?",r:"Órgão que adere ao procedimento de registro de preços e pode utilizar a ata para suas contratações."},
{q:"O que é carona em registro de preços?",r:"É a adesão de órgão não participante à ata de registro de preços, nos limites legais."},
{q:"O que é contrato verbal na Administração Pública?",r:"Em regra é vedado, salvo pequenas compras de pronto pagamento (dispensa), conforme a lei."},
{q:"O que é nota de empenho?",r:"Documento que reserva dotação orçamentária para fazer face a despesa autorizada, podendo substituir o contrato em casos legais."},
{q:"O que é ordem de serviço?",r:"Documento que autoriza o início da execução do objeto contratado."},
{q:"O que é recebimento provisório?",r:"É a etapa em que o objeto é recebido para verificação e conferência, antes do recebimento definitivo."},
{q:"O que é recebimento definitivo?",r:"É a etapa em que o objeto é aceito em definitivo pela Administração, após verificação de conformidade."},
{q:"O que é vício oculto no contrato administrativo?",r:"É o defeito não aparente que surge após o recebimento, cuja responsabilidade pode recair sobre o contratado."},
{q:"O que é responsabilidade solidária em licitação?",r:"É a responsabilidade conjunta de licitantes ou contratados por infrações ou danos, conforme o caso."},
{q:"O que é consórcio de empresas em licitação?",r:"É a união de empresas para participar de licitação, com responsabilidade solidária pelas obrigações."},
{q:"O que é subcontratação em contrato administrativo?",r:"É a transferência parcial da execução do objeto a terceiros, admitida nos limites do edital e do contrato."},
{q:"O que é cessão de contrato?",r:"É a transferência total do contrato a terceiro, admitida excepcionalmente e com anuência da Administração."},
{q:"O que é terceirização na Administração Pública?",r:"É a contratação de serviços por empresa especializada, com vínculo de emprego entre esta e seus empregados."},
{q:"O que é responsabilidade subsidiária da Administração em terceirização?",r:"É a responsabilidade da Administração por encargos trabalhistas não pagos pelo contratado, quando comprovada sua culpa na fiscalização."},
{q:"O que é fiscalização trabalhista em contratos terceirizados?",r:"É o dever da Administração de verificar o cumprimento das obrigações trabalhistas pela contratada."},
{q:"O que é CNDT em licitação?",r:"Certidão Negativa de Débitos Trabalhistas, exigida na habilitação para comprovar regularidade trabalhista."},
{q:"O que é certidão de regularidade fiscal?",r:"Documento que comprova a regularidade do licitante perante os fiscos federal, estadual e municipal."},
{q:"O que é balanço patrimonial em licitação?",r:"Demonstração contábil exigida na habilitação econômico-financeira para comprovar a saúde financeira do licitante."},
{q:"O que é atestado de capacidade técnica?",r:"Documento que comprova a experiência do licitante na execução de objeto semelhante ao licitado."},
{q:"O que é acervo técnico?",r:"Conjunto de documentos que comprovam a capacitação técnica do licitante ou profissional."},
{q:"O que é CAT em licitação?",r:"Certidão de Acervo Técnico, emitida pelo CREA, que comprova a experiência técnica do profissional ou empresa."},
{q:"O que é ART em licitação?",r:"Anotação de Responsabilidade Técnica, documento que identifica o responsável técnico pela obra ou serviço."},
{q:"O que é garantia de execução em obras?",r:"É a caução que assegura a execução da obra, podendo ser em dinheiro, seguro-garantia ou fiança bancária."},
{q:"O que é vistoria em licitação?",r:"É a visita ao local da execução do objeto, facultativa em regra, para que o licitante conheça as condições."},
{q:"O que é declaração de vistoria?",r:"Documento em que o licitante declara conhecer as condições locais da execução do objeto."},
{q:"O que é proposta técnica em licitação?",r:"É a oferta que descreve a metodologia e a solução técnica para atender ao objeto licitado."},
{q:"O que é proposta de preços?",r:"É a oferta financeira apresentada pelo licitante, com os valores para execução do objeto."},
{q:"O que é lance em pregão?",r:"É a oferta de valor feita pelos licitantes na etapa de disputa, com redução de preço ou maior desconto."},
{q:"O que é fase de lances?",r:"É a etapa do pregão em que os licitantes apresentam ofertas sucessivas para obter a melhor condição."},
{q:"O que é desempate em licitação?",r:"É o critério para definir o vencedor quando há empate entre propostas, conforme a lei."},
{q:"Quais são os critérios de desempate previstos na Nova Lei de Licitações?",r:"Bens nacionais, empresas brasileiras, microempresas e empresas de pequeno porte, entre outros."},
{q:"O que é tratamento diferenciado para ME e EPP em licitação?",r:"É o conjunto de benefícios previstos na LC 123/2006, como preferência em empates e habilitação diferenciada."},
{q:"O que é cota reservada para ME e EPP?",r:"É a reserva de até 25% do objeto para contratação exclusiva de microempresas e empresas de pequeno porte, em bens divisíveis."},
{q:"O que é licitação exclusiva para ME e EPP?",r:"É a realização de licitação destinada exclusivamente à participação de microempresas e empresas de pequeno porte, nos limites legais."},
{q:"O que é arbitragem em contratos administrativos?",r:"É o meio alternativo de solução de conflitos, admitido nos contratos da Nova Lei de Licitações, com previsão contratual."},
{q:"O que é mediação em contratos administrativos?",r:"É a forma de solução consensual de conflitos, admitida na Nova Lei de Licitações."},
{q:"O que é comissão de solução consensual de conflitos?",r:"É o colegiado criado para prevenir e resolver controvérsias em contratos administrativos."},
{q:"O que é due diligence em contratação pública?",r:"É a análise prévia de riscos e da capacidade do contratado antes da contratação."},
{q:"O que é compliance em licitação?",r:"É o conjunto de práticas de integridade e conformidade adotadas para prevenir fraudes e irregularidades."},
{q:"O que é programa de integridade em contratos públicos?",r:"É o conjunto de mecanismos de compliance exigido de contratados em contratos de grande vulto."},
{q:"O que é contrato de grande vulto?",r:"É o contrato cujo valor supera R$ 200 milhões, exigindo garantias e programa de integridade."},
{q:"O que é serviço continuado em contrato administrativo?",r:"É o serviço essencial e ininterrupto, cuja interrupção prejudica a Administração, permitindo prorrogação."},
{q:"Qual o prazo máximo de prorrogação de serviços continuados?",r:"Até 10 anos, mediante justificativa e vantajosidade econômica."},
{q:"O que é reajuste anual em contratos administrativos?",r:"É a atualização dos valores contratuais a cada 12 meses, conforme índice previsto no edital."},
{q:"O que é aniversário do contrato para reajuste?",r:"É a data-base para aplicação do reajuste, contada a partir da apresentação da proposta ou do orçamento."},
{q:"O que é apostilamento contratual?",r:"É o registro simples de alterações que não modificam o objeto nem o valor do contrato, como mudança de dotação."},
{q:"O que é termo aditivo?",r:"É o instrumento que formaliza alterações contratuais que modificam cláusulas, valor ou prazo."},
{q:"O que é supressão de objeto contratual?",r:"É a redução do objeto por interesse da Administração, com direito à recomposição do equilíbrio econômico."},
{q:"O que é acréscimo de objeto contratual?",r:"É o aumento do objeto, nos limites legais, com anuência do contratado."},

    jumpInput.blur();
  } else {
    alert("Digite um número entre 1 e " + questoes.length + ".");
  }
}
jumpInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); jumpTo(); }
});
document.addEventListener('keydown', function(e) {
  if (e.target === jumpInput) return;
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});
render();
</script>
</body>
</html>
