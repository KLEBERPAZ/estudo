<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>200 Questões - Licitação, Contratos e Convênios</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #222;
  }
  .container {
    background: #fff; border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    width: 100%; max-width: 860px; padding: 35px 40px;
  }
  .header { display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid #e2e8f0; padding-bottom: 14px; margin-bottom: 18px; }
  .header h1 { font-size: 1.05rem; color: #2a5298; }
  .counter { background: #2a5298; color: #fff; padding: 6px 16px;
    border-radius: 20px; font-size: .9rem; font-weight: 600; white-space: nowrap; }
  .jump { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 14px; font-size: .95rem; }
  .jump label { font-weight: 600; color: #2d3748; }
  .jump input[type="number"] {
    width: 90px; padding: 8px 10px; border: 1px solid #cbd5e0;
    border-radius: 8px; font-size: 1rem; font-family: inherit;
    text-align: center; color: #1a202c;
  }
  .jump input[type="number"]:focus { outline: 2px solid #2a5298; border-color: #2a5298; }
  .jump button { padding: 8px 18px; font-size: .95rem; border-radius: 8px; }
  .jump .total { color: #718096; font-size: .9rem; }
  .filter { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #eef4ff; border: 1px solid #c3d4f0; border-radius: 10px;
    padding: 10px 14px; margin-bottom: 20px; font-size: .95rem; }
  .filter label { font-weight: 600; color: #2d3748; }
  .filter select {
    flex: 1; min-width: 200px; padding: 8px 10px; border: 1px solid #cbd5e0;
    border-radius: 8px; font-size: .95rem; font-family: inherit; color: #1a202c;
    background: #fff;
  }
  .filter select:focus { outline: 2px solid #2a5298; border-color: #2a5298; }
  .filter .count { color: #4a5568; font-size: .85rem; white-space: nowrap; }
  .theme-badge { display: inline-block; background: #2a5298; color: #fff;
    font-size: .75rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .7px; padding: 4px 12px; border-radius: 20px;
    margin-bottom: 12px; }
  .question { font-size: 1.15rem; font-weight: 600; line-height: 1.55;
    color: #1a202c; min-height: 90px; margin-bottom: 18px; }
  .answer-box { background: #f0f7ff; border-left: 5px solid #2a5298;
    border-radius: 8px; padding: 16px 18px; font-size: 1rem;
    line-height: 1.6; color: #1a365d; }
  .answer-box strong { color: #2a5298; display: block; margin-bottom: 6px;
    font-size: .85rem; text-transform: uppercase; letter-spacing: .8px; }
  .nav { display: flex; justify-content: space-between; align-items: center;
    margin-top: 28px; gap: 12px; }
  button { background: #2a5298; color: #fff; border: none; padding: 12px 26px;
    border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: background .2s; font-family: inherit; }
  button:hover:not(:disabled) { background: #1e3c72; }
  button:disabled { background: #cbd5e0; cursor: not-allowed; }
  .hint { text-align: center; margin-top: 18px; font-size: .85rem; color: #718096; }
  .hint kbd { background: #edf2f7; border: 1px solid #cbd5e0;
    border-radius: 5px; padding: 2px 7px; font-family: monospace; }
  @media (max-width: 600px) { .container { padding: 24px 20px; }
    .question { font-size: 1rem; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Licitação, Contratos e Convênios</h1>
    <div class="counter" id="counter">1 / 200</div>
  </div>

  <div class="jump">
    <label for="jumpInput">Ir para a questão:</label>
    <input type="number" id="jumpInput" min="1" placeholder="nº" />
    <button onclick="jumpTo()">Ir</button>
    <span class="total" id="totalLabel">(1 a 200)</span>
  </div>

  <div class="filter">
    <label for="themeFilter">Filtrar por tema:</label>
    <select id="themeFilter" onchange="applyFilter()">
      <option value="">Todos os temas</option>
    </select>
    <span class="count" id="filterCount"></span>
  </div>

  <div class="theme-badge" id="themeBadge">Tema</div>
  <div class="question" id="question"></div>
  <div class="answer-box">
    <strong>Resposta</strong>
    <span id="answer"></span>
  </div>
  <div class="nav">
    <button id="prevBtn" onclick="prev()">← Anterior</button>
    <button id="nextBtn" onclick="next()">Próxima →</button>
  </div>
  <div class="hint">Use as teclas <kbd>←</kbd> e <kbd>→</kbd> do navegador</div>
</div>

<script>
const questoes = [
{q:"O que é licitação?",r:"É o procedimento administrativo pelo qual a Administração Pública seleciona a proposta mais vantajosa para contratar, observando os princípios constitucionais e legais.",t:"Conceito de licitação"},
{q:"Qual é a lei geral que rege as licitações e contratos da Administração Pública?",r:"A Lei nº 14.133/2021 (Nova Lei de Licitações), que substituiu a Lei 8.666/93, a Lei 10.520/02 (Pregão) e parte da Lei 12.462/11 (RDC).",t:"Lei geral de licitações"},
{q:"Quais são os princípios básicos da licitação?",r:"Legalidade, impessoalidade, moralidade, publicidade, eficiência, interesse público, probidade administrativa, igualdade, competitividade, economicidade, transparência e vinculação ao edital.",t:"Princípios da licitação"},
{q:"O que é o edital de licitação?",r:"É o instrumento convocatório que estabelece as regras, condições, critérios e exigências do procedimento licitatório.",t:"Edital de licitação"},
{q:"Quais são as modalidades de licitação previstas na Lei 14.133/2021?",r:"Pregão, concorrência, concurso, leilão e diálogo competitivo.",t:"Modalidades de licitação"},
{q:"O que é pregão?",r:"Modalidade de licitação obrigatória para bens e serviços comuns, cujo critério de julgamento é o menor preço ou maior desconto, com disputa em sessão pública.",t:"Pregão"},
{q:"O que é concorrência?",r:"Modalidade de licitação para contratação de bens e serviços especiais e de obras e serviços comuns de engenharia.",t:"Concorrência"},
{q:"O que é concurso?",r:"Modalidade de licitação para escolha de trabalho técnico, científico ou artístico, mediante instituição de prêmios ou remuneração aos vencedores.",t:"Concurso"},
{q:"O que é leilão?",r:"Modalidade de licitação para alienação de bens imóveis ou de móveis inservíveis, com critério de maior lance.",t:"Leilão"},
{q:"O que é diálogo competitivo?",r:"Modalidade de licitação para contratação de soluções inovadoras ou complexas, em que a Administração dialoga com licitantes previamente selecionados.",t:"Diálogo competitivo"},
{q:"Quais são os critérios de julgamento previstos na Nova Lei de Licitações?",r:"Menor preço, maior desconto, melhor técnica ou conteúdo artístico, técnica e preço, maior lance (leilão) e maior retorno econômico.",t:"Critérios de julgamento"},
{q:"O que é contrato administrativo?",r:"É o ajuste entre a Administração Pública e terceiros, regido por cláusulas exorbitantes e pelo direito público, para execução de obras, serviços, compras ou alienações.",t:"Conceito de contrato administrativo"},
{q:"Quais são as cláusulas exorbitantes dos contratos administrativos?",r:"Prerrogativas da Administração como alteração unilateral, rescisão unilateral, fiscalização, aplicação de sanções e ocupação provisória de bens.",t:"Cláusulas exorbitantes"},
{q:"O que é convênio?",r:"É o acordo entre entes públicos ou entre ente público e entidade privada sem fins lucrativos, para realização de interesses comuns, com mútua cooperação.",t:"Conceito de convênio"},
{q:"Qual a principal diferença entre contrato e convênio?",r:"No contrato há interesses contrapostos e remuneração; no convênio há interesses convergentes e cooperação mútua sem contraprestação.",t:"Diferença entre contrato e convênio"},
{q:"O que é dispensa de licitação?",r:"É a hipótese legal em que a licitação é formalmente dispensável, embora possível, por conveniência administrativa prevista em lei.",t:"Dispensa de licitação"},
{q:"O que é inexigibilidade de licitação?",r:"Ocorre quando há inviabilidade de competição, como na contratação de fornecedor exclusivo ou de profissional de notória especialização.",t:"Inexigibilidade de licitação"},
{q:"Qual o prazo de vigência dos contratos administrativos pela Lei 14.133/2021?",r:"Em regra, até 5 anos, podendo ser prorrogado mediante justificativa, respeitados os limites legais para serviços continuados (até 10 anos).",t:"Prazo de vigência dos contratos"},
{q:"O que é termo de referência?",r:"Documento que define o objeto, as especificações técnicas, as condições de execução e os critérios de julgamento para contratação de bens ou serviços.",t:"Termo de referência"},
{q:"O que é projeto básico?",r:"Conjunto de elementos que define a obra ou serviço de engenharia, com nível de precisão suficiente para caracterizar o objeto e permitir a elaboração da proposta.",t:"Projeto básico"},
{q:"O que é projeto executivo?",r:"Conjunto de elementos necessários e suficientes à execução completa da obra, detalhando todas as etapas e soluções técnicas.",t:"Projeto executivo"},
{q:"Quem pode participar de licitação?",r:"Qualquer interessado que atenda às exigências do edital, observadas as vedações legais (ex.: impedimentos por sanções ou conflito de interesses).",t:"Participantes da licitação"},
{q:"O que é habilitação em licitação?",r:"É a fase em que se verifica a capacidade jurídica, técnica, fiscal, social e econômico-financeira do licitante.",t:"Habilitação"},
{q:"Quais são as fases do procedimento licitatório na Lei 14.133/2021?",r:"Preparatória, divulgação do edital, apresentação de propostas e lances, julgamento, habilitação, recursal, homologação e adjudicação.",t:"Fases do procedimento licitatório"},
{q:"O que é adjudicação?",r:"É o ato pelo qual a Administração atribui ao vencedor o objeto da licitação, após a homologação.",t:"Adjudicação"},
{q:"O que é homologação?",r:"É o ato da autoridade competente que confirma o resultado da licitação e autoriza a contratação.",t:"Homologação"},
{q:"O que é impugnação de edital?",r:"É o instrumento pelo qual qualquer cidadão ou licitante questiona irregularidades no edital, no prazo legal.",t:"Impugnação de edital"},
{q:"Qual o prazo para impugnação de edital na Nova Lei de Licitações?",r:"Até 3 dias úteis antes da data de abertura do certame.",t:"Prazo para impugnação"},
{q:"O que é recurso administrativo em licitação?",r:"É o instrumento para contestar decisões da comissão ou autoridade durante o procedimento licitatório.",t:"Recurso administrativo"},
{q:"O que é sanção administrativa em licitação?",r:"É a penalidade aplicada ao licitante ou contratado por descumprimento de obrigações, como advertência, multa, impedimento ou declaração de inidoneidade.",t:"Sanções administrativas"},
{q:"O que é declaração de inidoneidade?",r:"Sanção que impede o licitante de contratar com a Administração Pública por até 3 anos, aplicada por irregularidades graves.",t:"Declaração de inidoneidade"},
{q:"O que é impedimento de licitar e contratar?",r:"Sanção que veda a participação em licitações e contratações por até 3 anos, conforme a infração.",t:"Impedimento de licitar e contratar"},
{q:"O que é garantia contratual?",r:"É a caução oferecida pelo contratado para assegurar o cumprimento das obrigações contratuais, limitada a 5% ou 10% do valor do contrato, conforme o caso.",t:"Garantia contratual"},
{q:"O que é fiscalização de contratos?",r:"É a atividade da Administração para acompanhar a execução contratual, verificando o cumprimento das obrigações pelo contratado.",t:"Fiscalização de contratos"},
{q:"O que é gestor de contratos?",r:"Servidor designado para coordenar as atividades administrativas relacionadas à execução do contrato.",t:"Gestor de contratos"},
{q:"O que é fiscal de contratos?",r:"Servidor designado para acompanhar e fiscalizar diretamente a execução do contrato.",t:"Fiscal de contratos"},
{q:"O que é reajuste de preços?",r:"É a atualização monetária dos valores contratuais em razão da variação de índices, conforme previsão no edital e no contrato.",t:"Reajuste de preços"},
{q:"O que é revisão de preços?",r:"É a alteração do valor contratual por fatos imprevisíveis ou supervenientes que alterem o equilíbrio econômico-financeiro.",t:"Revisão de preços"},
{q:"O que é equilíbrio econômico-financeiro do contrato?",r:"É a relação entre as obrigações do contratado e a remuneração, que deve ser mantida durante toda a execução contratual.",t:"Equilíbrio econômico-financeiro"},
{q:"O que é alteração unilateral do contrato?",r:"É a prerrogativa da Administração de modificar cláusulas de execução ou o objeto, respeitados os limites legais (25% ou 50% para reforma).",t:"Alteração unilateral do contrato"},
{q:"Qual o limite para acréscimos e supressões em contratos de obras e compras?",r:"Em regra, até 25% do valor inicial; para reformas de edifício ou equipamento, até 50%.",t:"Limites de acréscimos e supressões"},
{q:"O que é rescisão contratual?",r:"É a extinção do contrato antes do término, por acordo, por determinação da Administração ou por descumprimento.",t:"Rescisão contratual"},
{q:"Quais são as formas de rescisão do contrato administrativo?",r:"Unilateral (por interesse público ou descumprimento), consensual (por acordo) e judicial.",t:"Formas de rescisão"},
{q:"O que é convênio público?",r:"Acordo entre entes federativos ou entre a Administração e entidades privadas sem fins lucrativos para cooperação mútua em prol do interesse público.",t:"Convênio público"},
{q:"Qual é a lei que disciplina os convênios com a União?",r:"A Lei nº 13.019/2014 (Marco Regulatório das Organizações da Sociedade Civil) e o Decreto nº 6.170/2007, entre outras normas.",t:"Lei dos convênios com a União"},
{q:"O que é plano de trabalho em convênio?",r:"Documento que detalha o objeto, as metas, a aplicação dos recursos e o cronograma do convênio.",t:"Plano de trabalho em convênio"},
{q:"O que é contrapartida em convênio?",r:"É a participação financeira ou em bens e serviços do convenente, prevista no plano de trabalho.",t:"Contrapartida em convênio"},
{q:"O que é prestação de contas de convênio?",r:"É a apresentação, pelo convenente, da documentação comprobatória da aplicação dos recursos recebidos.",t:"Prestação de contas de convênio"},
{q:"O que é termo de parceria?",r:"É o instrumento firmado entre o Poder Público e as Organizações da Sociedade Civil de Interesse Público (OSCIP) para fomento e execução de projetos.",t:"Termo de parceria"},
{q:"O que é contrato de gestão?",r:"É o instrumento firmado entre o Poder Público e organizações sociais para a execução de atividades públicas não exclusivas.",t:"Contrato de gestão"},
{q:"O que é chamamento público?",r:"É o procedimento para selecionar organizações da sociedade civil interessadas em firmar parcerias com a Administração.",t:"Chamamento público"},
{q:"Quais são os tipos de parceria previstos na Lei 13.019/2014?",r:"Termo de fomento, termo de colaboração e acordo de cooperação.",t:"Tipos de parceria da Lei 13.019/2014"},
{q:"O que é termo de fomento?",r:"Parceria em que a Administração apoia projeto proposto pela organização da sociedade civil.",t:"Termo de fomento"},
{q:"O que é termo de colaboração?",r:"Parceria em que a Administração propõe o projeto e a organização da sociedade civil executa.",t:"Termo de colaboração"},
{q:"O que é acordo de cooperação?",r:"Parceria sem transferência de recursos financeiros, para mútua cooperação entre as partes.",t:"Acordo de cooperação"},
{q:"O que é plano de trabalho em parceria da Lei 13.019/2014?",r:"Documento que descreve o objeto, metas, indicadores, cronograma e aplicação dos recursos da parceria.",t:"Plano de trabalho em parceria"},
{q:"O que é conta bancária específica em convênio?",r:"Conta exclusiva para movimentação dos recursos do convênio, vedada a mistura com recursos próprios.",t:"Conta bancária específica em convênio"},
{q:"O que é ingerência indevida em convênio?",r:"É a interferência do concedente na gestão do convenente além dos limites legais, o que é vedado.",t:"Ingerência indevida em convênio"},
{q:"O que é denúncia em convênio?",r:"É a comunicação de irregularidades ou descumprimento das obrigações do convênio aos órgãos de controle.",t:"Denúncia em convênio"},
{q:"O que é tomada de contas especial?",r:"É o procedimento para apurar danos ao erário quando não há prestação de contas ou há irregularidades em convênios.",t:"Tomada de contas especial"},
{q:"O que é certame licitatório?",r:"É o conjunto de atos do procedimento licitatório, desde a publicação do edital até a homologação.",t:"Certame licitatório"},
{q:"O que é comissão de contratação?",r:"É o colegiado designado para conduzir o procedimento licitatório e julgar as propostas.",t:"Comissão de contratação"},
{q:"O que é agente de contratação?",r:"Servidor designado para conduzir a licitação, tomar decisões e executar as ações necessárias ao bom andamento do certame.",t:"Agente de contratação"},
{q:"O que é estudo técnico preliminar (ETP)?",r:"Documento que evidencia a necessidade da contratação e define a melhor solução, embasando o termo de referência ou projeto.",t:"Estudo técnico preliminar (ETP)"},
{q:"O que é matriz de riscos?",r:"Instrumento contratual que define a alocação de riscos entre as partes, utilizada em contratações de maior complexidade.",t:"Matriz de riscos"},
{q:"O que é seguro-garantia?",r:"É a modalidade de garantia contratual que cobre riscos de inadimplemento do contratado, podendo chegar a 30% do valor do contrato em obras.",t:"Seguro-garantia"},
{q:"O que é contratação integrada?",r:"Regime em que o contratado elabora o projeto básico e executivo e realiza a obra, com responsabilidade integral pelo resultado.",t:"Contratação integrada"},
{q:"O que é contratação semi-integrada?",r:"Regime em que o contratado elabora o projeto executivo com base no projeto básico fornecido pela Administração e executa a obra.",t:"Contratação semi-integrada"},
{q:"O que é empreitada por preço global?",r:"Regime de execução em que o contratado recebe valor fixo pela execução completa da obra ou serviço.",t:"Empreitada por preço global"},
{q:"O que é empreitada por preço unitário?",r:"Regime em que o contratado recebe por unidade de medida executada, conforme quantitativos do projeto.",t:"Empreitada por preço unitário"},
{q:"O que é tarefa em licitação?",r:"Regime de execução para pequenos serviços ou obras, com remuneração por tarefa concluída.",t:"Tarefa"},
{q:"O que é registro de preços?",r:"É o procedimento para registro de preços de bens ou serviços em ata, permitindo contratações futuras sem nova licitação.",t:"Registro de preços"},
{q:"O que é ata de registro de preços?",r:"Documento que formaliza os preços registrados e as condições para contratações futuras pelos órgãos participantes.",t:"Ata de registro de preços"},
{q:"O que é órgão gerenciador de ata de registro de preços?",r:"Órgão responsável pela condução do procedimento de registro de preços e pela gestão da ata.",t:"Órgão gerenciador de ata"},
{q:"O que é órgão participante de ata de registro de preços?",r:"Órgão que adere ao procedimento de registro de preços e pode utilizar a ata para suas contratações.",t:"Órgão participante de ata"},
{q:"O que é carona em registro de preços?",r:"É a adesão de órgão não participante à ata de registro de preços, nos limites legais.",t:"Carona em registro de preços"},
{q:"O que é contrato verbal na Administração Pública?",r:"Em regra é vedado, salvo pequenas compras de pronto pagamento (dispensa), conforme a lei.",t:"Contrato verbal na Administração Pública"},
{q:"O que é nota de empenho?",r:"Documento que reserva dotação orçamentária para fazer face a despesa autorizada, podendo substituir o contrato em casos legais.",t:"Nota de empenho"},
{q:"O que é ordem de serviço?",r:"Documento que autoriza o início da execução do objeto contratado.",t:"Ordem de serviço"},
{q:"O que é recebimento provisório?",r:"É a etapa em que o objeto é recebido para verificação e conferência, antes do recebimento definitivo.",t:"Recebimento provisório"},
{q:"O que é recebimento definitivo?",r:"É a etapa em que o objeto é aceito em definitivo pela Administração, após verificação de conformidade.",t:"Recebimento definitivo"},
{q:"O que é vício oculto no contrato administrativo?",r:"É o defeito não aparente que surge após o recebimento, cuja responsabilidade pode recair sobre o contratado.",t:"Vício oculto"},
{q:"O que é responsabilidade solidária em licitação?",r:"É a responsabilidade conjunta de licitantes ou contratados por infrações ou danos, conforme o caso.",t:"Responsabilidade solidária em licitação"},
{q:"O que é consórcio de empresas em licitação?",r:"É a união de empresas para participar de licitação, com responsabilidade solidária pelas obrigações.",t:"Consórcio de empresas"},
{q:"O que é subcontratação em contrato administrativo?",r:"É a transferência parcial da execução do objeto a terceiros, admitida nos limites do edital e do contrato.",t:"Subcontratação"},
{q:"O que é cessão de contrato?",r:"É a transferência total do contrato a terceiro, admitida excepcionalmente e com anuência da Administração.",t:"Cessão de contrato"},
{q:"O que é terceirização na Administração Pública?",r:"É a contratação de serviços por empresa especializada, com vínculo de emprego entre esta e seus empregados.",t:"Terceirização"},
{q:"O que é responsabilidade subsidiária da Administração em terceirização?",r:"É a responsabilidade da Administração por encargos trabalhistas não pagos pelo contratado, quando comprovada sua culpa na fiscalização.",t:"Responsabilidade subsidiária da Administração"},
{q:"O que é fiscalização trabalhista em contratos terceirizados?",r:"É o dever da Administração de verificar o cumprimento das obrigações trabalhistas pela contratada.",t:"Fiscalização trabalhista em terceirizados"},
{q:"O que é CNDT em licitação?",r:"Certidão Negativa de Débitos Trabalhistas, exigida na habilitação para comprovar regularidade trabalhista.",t:"CNDT"},
{q:"O que é certidão de regularidade fiscal?",r:"Documento que comprova a regularidade do licitante perante os fiscos federal, estadual e municipal.",t:"Certidão de regularidade fiscal"},
{q:"O que é balanço patrimonial em licitação?",r:"Demonstração contábil exigida na habilitação econômico-financeira para comprovar a saúde financeira do licitante.",t:"Balanço patrimonial"},
{q:"O que é atestado de capacidade técnica?",r:"Documento que comprova a experiência do licitante na execução de objeto semelhante ao licitado.",t:"Atestado de capacidade técnica"},
{q:"O que é acervo técnico?",r:"Conjunto de documentos que comprovam a capacitação técnica do licitante ou profissional.",t:"Acervo técnico"},
{q:"O que é CAT em licitação?",r:"Certidão de Acervo Técnico, emitida pelo CREA, que comprova a experiência técnica do profissional ou empresa.",t:"CAT"},
{q:"O que é ART em licitação?",r:"Anotação de Responsabilidade Técnica, documento que identifica o responsável técnico pela obra ou serviço.",t:"ART"},
{q:"O que é garantia de execução em obras?",r:"É a caução que assegura a execução da obra, podendo ser em dinheiro, seguro-garantia ou fiança bancária.",t:"Garantia de execução em obras"},
{q:"O que é vistoria em licitação?",r:"É a visita ao local da execução do objeto, facultativa em regra, para que o licitante conheça as condições.",t:"Vistoria em licitação"},
{q:"O que é declaração de vistoria?",r:"Documento em que o licitante declara conhecer as condições locais da execução do objeto.",t:"Declaração de vistoria"},
{q:"O que é proposta técnica em licitação?",r:"É a oferta que descreve a metodologia e a solução técnica para atender ao objeto licitado.",t:"Proposta técnica"},
{q:"O que é proposta de preços?",r:"É a oferta financeira apresentada pelo licitante, com os valores para execução do objeto.",t:"Proposta de preços"},
{q:"O que é lance em pregão?",r:"É a oferta de valor feita pelos licitantes na etapa de disputa, com redução de preço ou maior desconto.",t:"Lance em pregão"},
{q:"O que é fase de lances?",r:"É a etapa do pregão em que os licitantes apresentam ofertas sucessivas para obter a melhor condição.",t:"Fase de lances"},
{q:"O que é desempate em licitação?",r:"É o critério para definir o vencedor quando há empate entre propostas, conforme a lei.",t:"Desempate em licitação"},
{q:"Quais são os critérios de desempate previstos na Nova Lei de Licitações?",r:"Bens nacionais, empresas brasileiras, microempresas e empresas de pequeno porte, entre outros.",t:"Critérios de desempate"},
{q:"O que é tratamento diferenciado para ME e EPP em licitação?",r:"É o conjunto de benefícios previstos na LC 123/2006, como preferência em empates e habilitação diferenciada.",t:"Tratamento diferenciado para ME e EPP"},
{q:"O que é cota reservada para ME e EPP?",r:"É a reserva de até 25% do objeto para contratação exclusiva de microempresas e empresas de pequeno porte, em bens divisíveis.",t:"Cota reservada para ME e EPP"},
{q:"O que é licitação exclusiva para ME e EPP?",r:"É a realização de licitação destinada exclusivamente à participação de microempresas e empresas de pequeno porte, nos limites legais.",t:"Licitação exclusiva para ME e EPP"},
{q:"O que é arbitragem em contratos administrativos?",r:"É o meio alternativo de solução de conflitos, admitido nos contratos da Nova Lei de Licitações, com previsão contratual.",t:"Arbitragem em contratos administrativos"},
{q:"O que é mediação em contratos administrativos?",r:"É a forma de solução consensual de conflitos, admitida na Nova Lei de Licitações.",t:"Mediação em contratos administrativos"},
{q:"O que é comissão de solução consensual de conflitos?",r:"É o colegiado criado para prevenir e resolver controvérsias em contratos administrativos.",t:"Comissão de solução consensual de conflitos"},
{q:"O que é due diligence em contratação pública?",r:"É a análise prévia de riscos e da capacidade do contratado antes da contratação.",t:"Due diligence em contratação pública"},
{q:"O que é compliance em licitação?",r:"É o conjunto de práticas de integridade e conformidade adotadas para prevenir fraudes e irregularidades.",t:"Compliance em licitação"},
{q:"O que é programa de integridade em contratos públicos?",r:"É o conjunto de mecanismos de compliance exigido de contratados em contratos de grande vulto.",t:"Programa de integridade"},
{q:"O que é contrato de grande vulto?",r:"É o contrato cujo valor supera R$ 200 milhões, exigindo garantias e programa de integridade.",t:"Contrato de grande vulto"},
{q:"O que é serviço continuado em contrato administrativo?",r:"É o serviço essencial e ininterrupto, cuja interrupção prejudica a Administração, permitindo prorrogação.",t:"Serviço continuado"},
{q:"Qual o prazo máximo de prorrogação de serviços continuados?",r:"Até 10 anos, mediante justificativa e vantajosidade econômica.",t:"Prazo máximo de prorrogação de serviços continuados"},
{q:"O que é reajuste anual em contratos administrativos?",r:"É a atualização dos valores contratuais a cada 12 meses, conforme índice previsto no edital.",t:"Reajuste anual"},
{q:"O que é aniversário do contrato para reajuste?",r:"É a data-base para aplicação do reajuste, contada a partir da apresentação da proposta ou do orçamento.",t:"Aniversário do contrato para reajuste"},
{q:"O que é apostilamento contratual?",r:"É o registro simples de alterações que não modificam o objeto nem o valor do contrato, como mudança de dotação.",t:"Apostilamento contratual"},
{q:"O que é termo aditivo?",r:"É o instrumento que formaliza alterações contratuais que modificam cláusulas, valor ou prazo.",t:"Termo aditivo"},
{q:"O que é supressão de objeto contratual?",r:"É a redução do objeto por interesse da Administração, com direito à recomposição do equilíbrio econômico.",t:"Supressão de objeto"},
{q:"O que é acréscimo de objeto contratual?",r:"É o aumento do objeto, nos limites legais, com anuência do contratado.",t:"Acréscimo de objeto"},
{q:"O que é fato da Administração?",r:"É a conduta da Administração que impacta a execução contratual, gerando direito à revisão ou indenização.",t:"Fato da Administração"},
{q:"O que é fato do príncipe?",r:"É ato geral do Poder Público que impacta indiretamente o contrato, gerando direito à revisão do equilíbrio.",t:"Fato do príncipe"},
{q:"O que é álea administrativa?",r:"É o risco decorrente de atos da Administração que afetam o contrato, como alterações unilaterais.",t:"Álea administrativa"},
{q:"O que é álea econômica?",r:"É o risco decorrente de fatores de mercado que podem afetar o contrato, como variação de preços.",t:"Álea econômica"},
{q:"O que é álea ordinária?",r:"É o risco normal do negócio, que não gera direito à revisão contratual.",t:"Álea ordinária"},
{q:"O que é álea extraordinária?",r:"É o risco imprevisível que justifica a revisão do contrato para restabelecer o equilíbrio.",t:"Álea extraordinária"},
{q:"O que é teoria da imprevisão?",r:"É a possibilidade de revisão contratual diante de fatos imprevisíveis que alterem o equilíbrio econômico-financeiro.",t:"Teoria da imprevisão"},
{q:"O que é caso fortuito e força maior?",r:"São eventos imprevisíveis e inevitáveis que podem justificar revisão ou rescisão contratual.",t:"Caso fortuito e força maior"},
{q:"O que é multa contratual?",r:"É a sanção pecuniária aplicada ao contratado por descumprimento de obrigações contratuais.",t:"Multa contratual"},
{q:"O que é advertência em contrato administrativo?",r:"É a sanção mais branda, aplicada por faltas leves do contratado.",t:"Advertência em contrato"},
{q:"O que é suspensão temporária de participação em licitação?",r:"É a sanção que impede o contratado de licitar e contratar por até 3 anos.",t:"Suspensão temporária de participação em licitação"},
{q:"O que é desconsideração da personalidade jurídica em licitação?",r:"É a possibilidade de responsabilizar sócios por irregularidades, nos termos da lei.",t:"Desconsideração da personalidade jurídica"},
{q:"O que é responsabilidade objetiva do contratado?",r:"É a responsabilidade independentemente de culpa por danos causados à Administração ou a terceiros na execução do contrato.",t:"Responsabilidade objetiva do contratado"},
{q:"O que é garantia de obra pública?",r:"É a obrigação do contratado de reparar defeitos da obra pelo prazo legal de garantia (em regra 5 anos).",t:"Garantia de obra pública"},
{q:"O que é recebimento da obra pelo responsável técnico?",r:"É o ato de conferência técnica da execução, atestando a conformidade com o projeto.",t:"Recebimento da obra pelo responsável técnico"},
{q:"O que é diário de obra?",r:"É o registro diário das atividades, ocorrências e medições da execução da obra.",t:"Diário de obra"},
{q:"O que é medição de obra?",r:"É a verificação e quantificação dos serviços executados para fins de pagamento.",t:"Medição de obra"},
{q:"O que é cronograma físico-financeiro?",r:"É o instrumento que prevê a execução física e os desembolsos financeiros ao longo do contrato.",t:"Cronograma físico-financeiro"},
{q:"O que é aditivo de prazo?",r:"É o termo que prorroga o prazo de execução do contrato, mediante justificativa.",t:"Aditivo de prazo"},
{q:"O que é paralisação de obra?",r:"É a interrupção da execução, que pode gerar direito à prorrogação ou revisão contratual.",t:"Paralisação de obra"},
{q:"O que é atraso na execução contratual?",r:"É o descumprimento do cronograma, sujeitando o contratado a sanções.",t:"Atraso na execução contratual"},
{q:"O que é culpa in vigilando da Administração?",r:"É a omissão no dever de fiscalizar, gerando responsabilidade subsidiária em terceirizações.",t:"Culpa in vigilando"},
{q:"O que é culpa in eligendo?",r:"É a culpa na escolha do contratado, que pode gerar responsabilidade da Administração.",t:"Culpa in eligendo"},
{q:"O que é responsabilidade solidária do Estado por danos?",r:"É a obrigação de reparar danos causados a terceiros por seus agentes, assegurado o direito de regresso.",t:"Responsabilidade solidária do Estado por danos"},
{q:"O que é denunciação à lide em contratos administrativos?",r:"É a convocação do contratado para responder em ação judicial por danos relacionados ao contrato.",t:"Denunciação à lide"},
{q:"O que é seguro de responsabilidade civil em obras?",r:"É a apólice que cobre danos a terceiros durante a execução da obra.",t:"Seguro de responsabilidade civil em obras"},
{q:"O que é licenciamento ambiental em obras públicas?",r:"É a autorização prévia do órgão ambiental para execução de obras que causem impacto ambiental.",t:"Licenciamento ambiental em obras públicas"},
{q:"O que é estudo de impacto ambiental (EIA)?",r:"É o estudo prévio exigido para obras de significativo impacto ambiental, com relatório (RIMA).",t:"Estudo de impacto ambiental (EIA)"},
{q:"O que é sustentabilidade em licitação?",r:"É a exigência de critérios ambientais e sociais nas contratações públicas, conforme a Nova Lei.",t:"Sustentabilidade em licitação"},
{q:"O que é logística reversa em contratação pública?",r:"É a obrigação de retorno de produtos e embalagens após o uso, prevista em contratos sustentáveis.",t:"Logística reversa"},
{q:"O que é pregão eletrônico?",r:"É o pregão realizado por meio de sistema eletrônico, com disputa em plataforma digital.",t:"Pregão eletrônico"},
{q:"O que é pregão presencial?",r:"É o pregão realizado em sessão pública física, com a presença dos licitantes.",t:"Pregão presencial"},
{q:"O que é sistema de registro de preços para serviços?",r:"É o registro de preços de serviços para contratações futuras, conforme condições da ata.",t:"Registro de preços para serviços"},
{q:"O que é adesão a ata de registro de preços por órgão não participante?",r:"É o carona, limitado a 50% dos quantitativos por órgão e ao dobro do total da ata.",t:"Adesão a ata por órgão não participante"},
{q:"O que é catálogo eletrônico de padronização?",r:"É o instrumento que padroniza especificações de bens e serviços para contratações públicas.",t:"Catálogo eletrônico de padronização"},
{q:"O que é plataforma de contratações públicas?",r:"É o sistema eletrônico oficial para realização de licitações e contratações.",t:"Plataforma de contratações públicas"},
{q:"O que é PNCP?",r:"Portal Nacional de Contratações Públicas, que centraliza e divulga as contratações da Administração Pública.",t:"PNCP"},
{q:"O que é transparência em licitação?",r:"É o dever de divulgar os atos do procedimento, permitindo o controle social e a fiscalização.",t:"Transparência em licitação"},
{q:"O que é publicidade do edital?",r:"É a divulgação obrigatória do edital em veículos oficiais e no PNCP, para conhecimento dos interessados.",t:"Publicidade do edital"},
{q:"O que é sigilo das propostas?",r:"É a proteção das propostas até a fase de abertura, garantindo a competitividade do certame.",t:"Sigilo das propostas"},
{q:"O que é sessão pública de licitação?",r:"É a reunião em que se realizam a abertura das propostas, a disputa e o julgamento.",t:"Sessão pública de licitação"},
{q:"O que é ata de sessão de licitação?",r:"É o registro dos atos praticados na sessão pública, com as decisões da comissão.",t:"Ata de sessão de licitação"},
{q:"O que é julgamento das propostas?",r:"É a fase em que se avalia a conformidade e a vantajosidade das ofertas, conforme o critério do edital.",t:"Julgamento das propostas"},
{q:"O que é classificação das propostas?",r:"É a ordenação das propostas conforme o critério de julgamento, para identificar a mais vantajosa.",t:"Classificação das propostas"},
{q:"O que é desclassificação de proposta?",r:"É a exclusão da proposta que não atende às exigências do edital.",t:"Desclassificação de proposta"},
{q:"O que é inabilitação de licitante?",r:"É a exclusão do licitante que não comprova os requisitos de habilitação.",t:"Inabilitação de licitante"},
{q:"O que é diligência em licitação?",r:"É a verificação de informações ou documentos para esclarecer dúvidas durante o procedimento.",t:"Diligência em licitação"},
{q:"O que é saneamento de falhas em licitação?",r:"É a correção de irregularidades sanáveis, desde que não prejudique a competitividade.",t:"Saneamento de falhas"},
{q:"O que é proposta inexequível?",r:"É a proposta com valor incompatível com os custos de mercado, sujeita a desclassificação.",t:"Proposta inexequível"},
{q:"O que é preço de mercado em licitação?",r:"É o valor de referência obtido por pesquisa de preços, para aferir a vantajosidade das propostas.",t:"Preço de mercado em licitação"},
{q:"O que é orçamento estimado?",r:"É o valor máximo previsto pela Administração para a contratação, sigiloso ou divulgado conforme o caso.",t:"Orçamento estimado"},
{q:"O que é pesquisa de preços?",r:"É o procedimento para estimar o valor de mercado do objeto, com base em fontes diversas.",t:"Pesquisa de preços"},
{q:"O que é valor estimado da contratação?",r:"É o montante previsto pela Administração para a despesa, base para o orçamento e o julgamento.",t:"Valor estimado da contratação"},
{q:"O que é vantajosidade da proposta?",r:"É a condição da oferta que melhor atende ao interesse público, considerando preço e qualidade.",t:"Vantajosidade da proposta"},
{q:"O que é economicidade em licitação?",r:"É a obtenção do melhor resultado com o menor custo, observados os padrões de qualidade.",t:"Economicidade em licitação"},
{q:"O que é eficiência em licitação?",r:"É a obtenção de resultados com racionalidade e celeridade, evitando desperdícios.",t:"Eficiência em licitação"},
{q:"O que é moralidade administrativa em licitação?",r:"É a observância da ética e da probidade nos atos do procedimento licitatório.",t:"Moralidade administrativa em licitação"},
{q:"O que é impessoalidade em licitação?",r:"É a vedação de favoritismos e tratamentos diferenciados indevidos entre licitantes.",t:"Impessoalidade em licitação"},
{q:"O que é competitividade em licitação?",r:"É a garantia de ampla participação de interessados, com igualdade de condições.",t:"Competitividade em licitação"},
{q:"O que é vinculação ao edital?",r:"É a obrigação de a Administração e os licitantes observarem fielmente as regras do edital.",t:"Vinculação ao edital"},
{q:"O que é julgamento objetivo?",r:"É a avaliação das propostas com base em critérios claros e previamente definidos no edital.",t:"Julgamento objetivo"},
{q:"O que é adjudicação compulsória?",r:"É o dever de a Administração adjudicar o objeto ao vencedor, após o julgamento.",t:"Adjudicação compulsória"},
{q:"O que é revogação da licitação?",r:"É a extinção do procedimento por interesse público superveniente, devidamente justificado.",t:"Revogação da licitação"},
{q:"O que é anulação da licitação?",r:"É a extinção do procedimento por ilegalidade, com efeitos retroativos.",t:"Anulação da licitação"},
{q:"O que é efeito ex tunc da anulação?",r:"É o efeito retroativo da anulação, alcançando os atos praticados desde o vício.",t:"Efeito ex tunc da anulação"},
{q:"O que é efeito ex nunc da revogação?",r:"É o efeito não retroativo da revogação, que alcança apenas os atos futuros.",t:"Efeito ex nunc da revogação"},
{q:"O que é controle externo em licitação?",r:"É a fiscalização exercida pelo Poder Legislativo, com auxílio dos Tribunais de Contas.",t:"Controle externo em licitação"},
{q:"O que é controle interno em licitação?",r:"É a fiscalização exercida pela própria Administração, por meio de seus órgãos de controle.",t:"Controle interno em licitação"},
{q:"O que é auditoria em contratos públicos?",r:"É a verificação independente da regularidade e da eficiência da execução contratual.",t:"Auditoria em contratos públicos"},
{q:"O que é representação ao Tribunal de Contas?",r:"É a comunicação de irregularidades ao TC, para apuração e providências.",t:"Representação ao Tribunal de Contas"},
{q:"O que é denúncia ao Ministério Público em licitação?",r:"É a comunicação de ilegalidades ao MP, para adoção das medidas cabíveis.",t:"Denúncia ao Ministério Público"},
{q:"O que é improbidade administrativa em licitação?",r:"É a conduta ilegal e desonesta de agentes públicos que causa dano ao erário ou viola princípios.",t:"Improbidade administrativa em licitação"},
{q:"O que é conflito de interesses em licitação?",r:"É a situação em que agente público ou licitante tem interesse pessoal que possa influir no procedimento.",t:"Conflito de interesses em licitação"},
{q:"O que é vedação à participação de parentes em licitação?",r:"É a proibição de participação de pessoas ligadas a agentes públicos, para evitar favorecimento.",t:"Vedação à participação de parentes"},
{q:"O que é nepotismo em contratação pública?",r:"É a contratação de parentes de agentes públicos, vedada por princípios constitucionais.",t:"Nepotismo em contratação pública"},
{q:"O que é fracionamento de despesa?",r:"É a divisão indevida da despesa para burlar a modalidade de licitação, o que é vedado.",t:"Fracionamento de despesa"},
{q:"O que é jogo de planilha em obras?",r:"É a manipulação de quantitativos e preços para obter vantagem indevida na execução contratual.",t:"Jogo de planilha em obras"},
{q:"O que é superfaturamento?",r:"É a cobrança de valor acima do mercado, causando dano ao erário.",t:"Superfaturamento"},
{q:"O que é sobrepreço?",r:"É a fixação de preço acima do valor de mercado na proposta ou no contrato.",t:"Sobrepreço"},
{q:"O que é aditivo contratual irregular?",r:"É a alteração contratual sem amparo legal ou sem justificativa, sujeita a anulação.",t:"Aditivo contratual irregular"},
{q:"O que é pagamento antecipado em contrato público?",r:"É o pagamento antes da execução, admitido excepcionalmente com garantias, conforme a lei.",t:"Pagamento antecipado em contrato público"},
{q:"O que é medição fraudulenta?",r:"É a declaração falsa de serviços executados para obter pagamento indevido.",t:"Medição fraudulenta"},
{q:"O que é obra inacabada?",r:"É a obra não concluída no prazo, sujeita a sanções e providências da Administração.",t:"Obra inacabada"},
{q:"O que é garantia de retenção em contrato?",r:"É a retenção de parte dos pagamentos para assegurar a execução ou a correção de defeitos.",t:"Garantia de retenção em contrato"},
{q:"O que é caução em dinheiro?",r:"É a garantia prestada por depósito em conta, para assegurar obrigações contratuais.",t:"Caução em dinheiro"},
{q:"O que é fiança bancária?",r:"É a garantia prestada por instituição financeira, para assegurar obrigações contratuais.",t:"Fiança bancária"},
{q:"O que é seguro-garantia com cláusula de retomada?",r:"É a apólice que permite à seguradora assumir a execução do contrato em caso de inadimplemento.",t:"Seguro-garantia com cláusula de retomada"},
{q:"O que é contratação de serviços com dedicação exclusiva de mão de obra?",r:"É a contratação em que os empregados atuam exclusivamente no serviço contratado, com fiscalização específica.",t:"Serviços com dedicação exclusiva de mão de obra"},
{q:"O que é planilha de custos em terceirização?",r:"É o documento que detalha os custos da contratação, incluindo encargos e benefícios.",t:"Planilha de custos em terceirização"},
{q:"O que é repactuação em serviços continuados?",r:"É a revisão dos custos vinculada à variação de preços de mercado ou de convenção coletiva.",t:"Repactuação em serviços continuados"},
{q:"O que é convenção coletiva em terceirização?",r:"É o acordo sindical que estabelece direitos dos trabalhadores, impactando os custos contratuais.",t:"Convenção coletiva em terceirização"},
{q:"O que é visto em nota fiscal de serviço?",r:"É o atesto de que o serviço foi prestado, condição para o pagamento.",t:"Visto em nota fiscal de serviço"},
{q:"O que é atesto de nota fiscal?",r:"É a declaração do fiscal de que o serviço ou bem foi recebido conforme o contrato.",t:"Atesto de nota fiscal"},
{q:"O que é liquidação da despesa?",r:"É a verificação do direito adquirido pelo credor, com base nos documentos comprobatórios.",t:"Liquidação da despesa"},
{q:"O que é empenho da despesa?",r:"É a reserva de dotação orçamentária para atender a despesa autorizada.",t:"Empenho da despesa"},
{q:"O que é pagamento por estimativa?",r:"É o pagamento baseado em previsão, admitido em casos específicos, com posterior ajuste.",t:"Pagamento por estimativa"},
{q:"O que é glosa de pagamento?",r:"É a retenção ou recusa de pagamento por desconformidade com o contrato.",t:"Glosa de pagamento"},
{q:"O que é retenção de tributos em contrato público?",r:"É o desconto de impostos na fonte, conforme a legislação tributária.",t:"Retenção de tributos"},
{q:"O que é retenção previdenciária em contrato público?",r:"É o desconto de contribuições previdenciárias, conforme a lei.",t:"Retenção previdenciária"},
{q:"O que é certidão negativa de débitos em pagamento?",r:"É a comprovação de regularidade fiscal exigida para o pagamento.",t:"Certidão negativa de débitos em pagamento"},
{q:"O que é regularidade do FGTS em contratação?",r:"É a comprovação de recolhimento do FGTS, exigida na habilitação e na execução.",t:"Regularidade do FGTS"},
{q:"O que é CNO em obra pública?",r:"Cadastro Nacional de Obras, que registra a obra para fins previdenciários.",t:"CNO em obra pública"},
{q:"O que é SICRO em obras públicas?",r:"Sistema de Custos Rodoviários, referência para orçamentos de obras de infraestrutura.",t:"SICRO em obras públicas"},
{q:"O que é SINAPI em obras públicas?",r:"Sistema Nacional de Pesquisa de Custos e Índices da Construção Civil, referência para orçamentos.",t:"SINAPI em obras públicas"},
{q:"O que é BDI em obras públicas?",r:"Benefícios e Despesas Indiretas, componente do orçamento que cobre custos indiretos e lucro.",t:"BDI em obras públicas"},
{q:"O que é curva ABC em obras?",r:"É a classificação de insumos e serviços por relevância econômica, para gestão do contrato.",t:"Curva ABC em obras"},
{q:"O que é composição de preço unitário?",r:"É o detalhamento dos custos de cada serviço, com insumos, mão de obra e encargos.",t:"Composição de preço unitário"},
{q:"O que é orçamento baseado em produtividade?",r:"É o orçamento que considera índices de produtividade para estimar custos e prazos.",t:"Orçamento baseado em produtividade"},
{q:"O que é cronograma de desembolso?",r:"É a previsão dos pagamentos ao longo da execução contratual.",t:"Cronograma de desembolso"},
{q:"O que é medição por evento?",r:"É a medição baseada na conclusão de etapas ou marcos do contrato.",t:"Medição por evento"},
{q:"O que é recebimento por etapa?",r:"É o aceite parcial do objeto, conforme etapas concluídas do cronograma.",t:"Recebimento por etapa"},
{q:"O que é termo de encerramento de contrato?",r:"É o documento que formaliza o fim do contrato e a quitação das obrigações.",t:"Termo de encerramento de contrato"},
{q:"O que é quitação contratual?",r:"É o reconhecimento do cumprimento das obrigações, com ressalvas quanto a vícios ocultos.",t:"Quitação contratual"},

let idx = 0;
let filtered = [];

const qEl = document.getElementById('question');
const aEl = document.getElementById('answer');
const cEl = document.getElementById('counter');
const tEl = document.getElementById('themeBadge');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const jumpInput = document.getElementById('jumpInput');
const themeFilter = document.getElementById('themeFilter');
const filterCount = document.getElementById('filterCount');
const totalLabel = document.getElementById('totalLabel');

// Popula o select de temas únicos
function populateThemes() {
  const themes = [...new Set(questoes.map(q => q.t))].sort((a, b) =>
    a.localeCompare(b, 'pt-BR')
  );
  themes.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    themeFilter.appendChild(opt);
  });
}

function applyFilter() {
  const chosen = themeFilter.value;
  if (!chosen) {
    filtered = questoes.map((_, i) => i);
  } else {
    filtered = questoes.map((q, i) => q.t === chosen ? i : -1).filter(i => i !== -1);
  }
  idx = 0;
  filterCount.textContent = filtered.length + ' questão(ões)';
  totalLabel.textContent = '(total: ' + questoes.length + ')';
  render();
}

function render() {
  if (filtered.length === 0) {
    tEl.textContent = '—';
    qEl.textContent = 'Nenhuma questão encontrada para o filtro selecionado.';
    aEl.textContent = '';
    cEl.textContent = '0 / 0';
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    jumpInput.value = '';
    return;
  }
  const realIdx = filtered[idx];
  const q = questoes[realIdx];
  tEl.textContent = q.t;
  qEl.textContent = q.q;
  aEl.textContent = q.r;
  cEl.textContent = (idx + 1) + ' / ' + filtered.length + ' (Q' + (realIdx + 1) + ')';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === filtered.length - 1;
  jumpInput.value = realIdx + 1;
}

function next() { if (idx < filtered.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }

function jumpTo() {
  const n = parseInt(jumpInput.value, 10);
  if (isNaN(n) || n < 1 || n > questoes.length) {
    alert("Digite um número entre 1 e " + questoes.length + ".");
    return;
  }
  // Se houver filtro ativo, procura a questão no filtro; senão, vai direto
  const posInFiltered = filtered.indexOf(n - 1);
  if (posInFiltered !== -1) {
    idx = posInFiltered;
    render();
  } else {
    // Remove o filtro para permitir o salto
    themeFilter.value = '';
    filtered = questoes.map((_, i) => i);
    filterCount.textContent = filtered.length + ' questão(ões)';
    idx = n - 1;
    render();
  }
  jumpInput.blur();
}

jumpInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); jumpTo(); }
});

document.addEventListener('keydown', function(e) {
  if (e.target === jumpInput) return;
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

// Inicialização
populateThemes();
filtered = questoes.map((_, i) => i);
filterCount.textContent = filtered.length + ' questão(ões)';
render();
</script>
